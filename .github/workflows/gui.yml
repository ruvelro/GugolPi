name: GUI

on:
  push:
    branches: [main]
    paths:
      - "apps/gugolpi-gui/**"
      - "crates/**"
      - "Cargo.*"
      - ".github/workflows/gui.yml"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Empaquetar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
              target/release/gugolpi-gui.exe
          - os: macos-latest
            bundles: |
              target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            bundles: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gugolpi-gui/package-lock.json
      - name: Instalar dependencias npm
        working-directory: apps/gugolpi-gui
        run: npm ci
      - name: Compilar y empaquetar
        working-directory: apps/gugolpi-gui
        run: npm run tauri -- build --ci
      - name: Publicar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: gugolpi-gui-${{ matrix.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 30
