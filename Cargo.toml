[workspace]
resolver = "2"
members = ["crates/gugolpi-core", "crates/gugolpi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ruvelro/GugolPi"
authors = ["ruvelro"]
readme = "README.md"

[workspace.dependencies]
gugolpi-core = { path = "crates/gugolpi-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
core_affinity = "0.8"
sha2 = "0.10"
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = "1"
assert_cmd = "2"
predicates = "3"
toml = "0.9"

# Lints compartidos: sin pánicos posibles en biblioteca, sin `unsafe` salvo en el módulo simd.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
return_self_not_must_use = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
inherits = "release"
